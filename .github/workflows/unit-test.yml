name: Unit Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同じブランチ/PR に新しい push があったら、古い実行は結果を待つ意味がないのでキャンセルする。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # AGP 9 / Gradle 9 は JDK 17 以上が必要。ソース/ターゲットは build.gradle.kts で Java 11 に固定している。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle のキャッシュと wrapper の検証を行う。
      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
